name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'ros2_base_images/**'
      - 'ros2_mujoco/**'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:  # 允许手动触发

env:
  DOCKER_HUB_REPO: yutouxiaozhuan/docker_images

jobs:
  # ======== Job 1: 构建并推送 ros2_humble 基础镜像 ========
  build-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push ros2_humble
        uses: docker/build-push-action@v5
        with:
          context: ./ros2_base_images
          file: ./ros2_base_images/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_HUB_REPO }}:ros2_humble
            ${{ env.DOCKER_HUB_REPO }}:ros2_humble-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ======== Job 2: 构建并推送 ros2_humble_mujoco 镜像（依赖 Job 1） ========
  build-mujoco:
    needs: build-base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push ros2_humble_mujoco
        uses: docker/build-push-action@v5
        with:
          context: ./ros2_mujoco
          file: ./ros2_mujoco/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_HUB_REPO }}:ros2_humble_mujoco
            ${{ env.DOCKER_HUB_REPO }}:ros2_humble_mujoco-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max